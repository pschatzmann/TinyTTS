# /etc/asound.conf on a Milk-V Duo 256M: the MAX98357A on I2S2 as the default
# device. "plug" converts the sample rate and format; the "route" step plays
# mono on both channels, since the I2S driver sends mono in the left slot only
# and a MAX98357A with SD_MODE open plays (left + right) / 2.
pcm.max98357a {
	type hw
	card cv1835max98357a
	device 0
}

pcm.!default {
	type plug
	slave {
		pcm "max98357a"
		channels 2
	}
	route_policy duplicate
}

ctl.!default {
	type hw
	card cv1835max98357a
}
